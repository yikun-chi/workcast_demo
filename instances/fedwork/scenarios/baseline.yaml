id: baseline
title: "2025 as announced: return to the office and the deferred resignation offer"
short_title: As announced
description: >
  Every agency's employees from the December 2024 snapshot, from 1 January to 31 December 2025. The presidential
  memorandum of 20 January 2025 ends remote work; OPM's offer of 28 January lets full-time employees resign effective
  30 September 2025 with pay until then, and closes on 12 February. Only these announced dates enter the simulation.
horizon_days: 365
seeds: [1, 2, 3]
world:
  start: "2025-01-01"
  end: "2025-12-31"
  population_file: twins_2024-12.parquet
  count_by: agency_group
  stock: depleting
  work_events: none
  twins_sample: 500
  priors: sample
  events:
    rto: {start: "2025-01-20"}
    drp_window: {start: "2025-02-13", end: "2025-09-30"}
  offers:
    - {id: drp, decide: "2025-02-12", effective: "2025-09-30", who: "fulltime=1"}
interventions: []
