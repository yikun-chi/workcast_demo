# Seat -> policy adapter. Workload seats choose the model a workload runs on among the models the kernel lists that
# week, with weights from standing, list price and launch priors. Swapping a seat to an LLM is a config change.
default:
  adapter: rule
seats:
  workload:
    adapter: rule
  company:
    adapter: rule
  # Example: let a hosted model choose for programming workloads (needs ANTHROPIC_API_KEY; falls back to the rule).
