id: ai_answers
title: What if an AI answer channel took 10% of desktop and mobile-web needs?
short_title: AI answers take 10%
summary: "From May 14, 2024, an AI answer channel ramps up over eight weeks to take 10% of the needs that reach Wikipedia through desktop and mobile web (searches), none through the app."
description: >
  Same needs, habits and seeds as the simulation of what happened. From May 14, 2024 an AI answer channel reaches
  readers who search (desktop and mobile web) and, once fully rolled out on July 9, answers 10% of their needs
  without a visit. The 10% is a scenario assumption for sizing the traffic at risk, not a measured effect.
extends: baseline
seeds: [1, 2, 3]
interventions:
  - {type: ai_channel, start: "2024-05-14", full: "2024-07-09", share: 0.10, access: [desktop, mobile-web]}
