# Seat -> policy adapter. A seat is a role id from ontology/bindings.yaml; the kernel offers each seat only the
# options its constraints allow, with weights from calibration/process.json, and the seat chooses.
default: {adapter: rule}
seats:
  buyer: {adapter: rule}
  purchasing_clerk: {adapter: rule}
  goods_receipt: {adapter: rule}
  ap_invoice: {adapter: rule}
  ap_payment: {adapter: rule}
  batch: {adapter: rule}
  vendor: {adapter: rule}
