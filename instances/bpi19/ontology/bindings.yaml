    count: 1975
    date_only_events: true
policies:
- id: pol:automate_payment_block
  label: Automate payment-block removal
  affects:
  - Remove Payment Block
  - ap_payment
  - cap:remove_payment_block
- id: pol:ap_capacity
  label: Accounts payable capacity +30%
  affects:
  - ap_invoice
  - ap_payment
- id: pol:fast_invoice_handling
  label: Shorter manual invoice handling
  affects:
  - Record Invoice Receipt
  - Clear Invoice
  - ap_invoice
- id: pol:demand_surge
  label: Order volume +30%
  affects:
  - Create Purchase Order Item
  - purchasing_clerk
  - goods_receipt
  - ap_invoice
  - ap_payment
- id: pol:workforce_expansion
  label: September 2018 workforce expansion (1.60x active staff)
  affects:
  - buyer
  - purchasing_clerk
  - goods_receipt
  - ap_invoice
  - ap_payment
