organization:
  id: org:bpi19
  label: Multinational coatings and paints group (anonymized), purchase-to-pay
  properties:
    company_ids: 4
    dominant_company_share: 0.9958
    period: 2018-01-01 .. 2019-01-31
    source: BPI Challenge 2019 (CC BY 4.0)
org_units:
- id: ou:procurement
  label: Procurement
  properties:
    description: Requisitioners, buyers and purchasing clerks who create and maintain purchase orders
- id: ou:warehouse
  label: Warehouse and goods receipt
  properties:
    description: Receiving staff who record goods receipts and service entry sheets
- id: ou:accounts_payable
  label: Accounts payable
  properties:
    description: Invoice verification and the weekly payment run (Thursday)
- id: ou:shared_services
  label: Shared services and IT batch
  properties:
    description: ERP batch jobs and interfaces (batch_ users, SRM transfer, service entry uploads)
roles:
- id: buyer
  label: Buyer / requisitioner
  onet_code: 13-1023.00
  org_unit: ou:procurement
  headcount: 25
  properties:
    inference: users whose train-window events are mostly requisition, approval and release steps
    headcount_basis: distinct users active in the training window (Jan-Jun 2018)
- id: purchasing_clerk
  label: Purchasing clerk
  onet_code: 43-3061.00
  org_unit: ou:procurement
  headcount: 142
  properties:
    inference: users whose events are mostly PO item creation and PO changes
    headcount_basis: distinct users active in the training window (Jan-Jun 2018)
- id: goods_receipt
  label: Goods receipt clerk
  onet_code: 43-5071.00
  org_unit: ou:warehouse
  headcount: 176
  properties:
    inference: users whose events are mostly Record / Cancel Goods Receipt
    headcount_basis: distinct users active in the training window (Jan-Jun 2018)
- id: ap_invoice
  label: AP invoice clerk
  onet_code: 43-3031.00
  org_unit: ou:accounts_payable
  headcount: 26
  properties:
    inference: users whose events are mostly Record / Cancel Invoice Receipt
    headcount_basis: distinct users active in the training window (Jan-Jun 2018)
- id: ap_payment
  label: AP payment specialist
  onet_code: 43-3031.00
  org_unit: ou:accounts_payable
  headcount: 12
  properties:
    inference: users whose events are mostly Clear Invoice and payment-block handling
    headcount_basis: distinct users active in the training window (Jan-Jun 2018)
- id: batch
  label: ERP batch job
  onet_code: 15-1244.00
  org_unit: ou:shared_services
  headcount: 14
  properties:
    inference: the 20 batch_ user ids; automated executors
    headcount_basis: distinct users active in the training window (Jan-Jun 2018)
- id: vendor
  label: Vendor (external)
  org_unit: ou:procurement
  headcount: 1
  properties:
    external: true
    inference: resource NONE on vendor-side activities; 1,975 vendor ids
systems:
- id: sys:erp
  label: ERP procurement and finance module
  properties:
    kind: ERP (SAP MM/FI style)
  capabilities:
  - id: cap:create_po
    label: Create or change purchase order item
  - id: cap:record_goods_receipt
    label: Record goods receipt / service entry
  - id: cap:record_invoice
    label: Record invoice receipt
  - id: cap:set_payment_block
    label: Set payment block
  - id: cap:remove_payment_block
    label: Remove payment block
  - id: cap:clear_invoice
    label: Clear invoice (payment run)
  - id: cap:batch_post
    label: Scheduled batch posting
- id: sys:srm
  label: Supplier relationship management (self-service requisitions)
  capabilities:
  - id: cap:srm_request
    label: Create and approve shopping-cart requisition
  - id: cap:srm_transfer
    label: Transfer requisition to ERP
- id: sys:vendor_portal
  label: Vendor invoicing channel
  capabilities:
  - id: cap:vendor_invoice
    label: Submit invoice or debit memo
artifacts:
