# Service world settings (orgsim/worlds/service.py), frozen after the development cutoffs (docs/plans/cfpb_complaints_protocol.md).
# Every quantity below is either a fixed setting chosen on the dev cutoffs or is re-estimated at each cutoff from complaints
# received before it (holiday effects, annual patterns, levels, own growth, on-time rates, backtest shock sizes).
n_orgs: 50                      # companies with the most complaints in the 13 weeks before the cutoff
selection_weeks: 13
segment_min_share: 0.05         # a product with at least 5% of a company's complaints (last 26 weeks) is its own segment
share_weeks: 26
history_weeks: 156              # weeks of history at each cutoff
inner_cutoffs: 8                # earlier backtests (targets end before the cutoff); they set the shock sizes for the ranges
inner_step_weeks: 4
# Demand specification fixed on the dev cutoffs (dev_variants.yaml, round 3: f_k4_w05_p06): the starting level is the
# mean of the last four weeks; growth starts at half the segment's own eight-week growth and fades by 0.6 a week;
# no annual pattern, forward drift, reversion or pooling (each raised the dev error). Holiday weeks are always applied.
grid:
  k_level: [4]
  phi: [0.6]
  w: [0.5]
  seasonal: [0.0]
  drift: [0.0]
  revert: [1.0]
  pool: [0.0]
simplest: {k_level: 4, phi: 0.6, w: 0.5, seasonal: 0.0, drift: 0.0, revert: 1.0, pool: 0.0}
one_se: true
tiers: []
on_time:
  deadline_days: 15             # CFPB: a company is expected to respond within 15 days; flags are known after that
  base_weeks: 4                 # on-time rate of the last four weeks whose deadline has passed
  prior_n: 5                    # pseudo-count shrinking a product's on-time rate to its company's
  response_weeks: 52
  load_response: false          # the estimated load response raised the dev error (rounds 1-2), so it is off
