id: ctrip
title: Work-from-home experiment in a call centre (Ctrip, QJE 2015)
company: Ctrip
order: 40
problem: "Can we predict what four days a week at home does to call-centre output and quits?"
situation: "In December 2010 Ctrip let 131 of 249 volunteer call-centre employees in Shanghai work from home four days a week for nine months; the other 118 stayed in the office. Who went home was decided by an even or odd birthday, so the two groups are directly comparable."
data_used: "The authors' replication files: a weekly performance panel for every call-centre employee from January 2010 (calls answered and an overall performance score), each participant's pre-experiment characteristics (commute, family, tenure, pay), and who quit by the end of the experiment."
protocol_line: "Simulation predictions use each employee's 2010 record and assumptions from research published before the experiment's results. Outcomes after 6 December 2010 are used only to check accuracy."
intro: >
  Simulates the 249 volunteers of Ctrip's 2010-11 work-from-home experiment as digital twins over the nine months:
  half work from home four days a week, half stay in the office. Each twin carries its own 2010 call volume and
  performance level, and its weekly output and quit risk respond to home working through assumptions taken from earlier
  research. The prediction is scored against the randomized experiment; the alternative asks what two home days a week
  would have done, the arrangement Trip.com tested a decade later.
world_type: workforce
world: >
  249 call-centre employees in Shanghai over 38 weeks (6 Dec 2010 to 19 Aug 2011). 131 were randomly sent home four
  days a week. Every participant is a digital twin built from their own 2010 weekly record and characteristics;
  outcomes are weekly calls answered, the overall performance score and quits, scored at the group level against the
  experiment.
source: "manifests/sources.json (Bloom, Liang, Roberts & Ying 2015 replication files; Harvard Dataverse doi:10.7910/DVN/PZQOB1, CC0)"
data:
  raw: instances/ctrip/data/raw/
  normalized: instances/ctrip/data/normalized/
clock:
  tick: 1h
  coverage: "2010-12-06 .. 2011-08-19"
  wfh_eligible_days: ["Monday", "Tuesday", "Wednesday", "Thursday"]
scenarios:
  baseline: baseline
  alternative: two_days_home
evaluation:
  design: "group-level prediction of the experiment's effects from 2010 records and sourced priors"
  freeze_rule: "calibration uses 2010 weeks only; priors cite work published before February 2013; specification chosen on 2010 pseudo-changes"
status: "ready: ingest, calibration, baseline, evaluation and report"
