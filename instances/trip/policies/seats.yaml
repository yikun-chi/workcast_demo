# Seat -> policy adapter. The world offers each agent options (wfh/office on an eligible day; quit/stay weekly)
# with prior-driven weights; the seat's policy chooses. Swapping a seat to an LLM is a config change.
default:
  adapter: rule
seats:
  employee:
    adapter: rule
  manager:
    adapter: rule
  # Example: let managers be played by a hosted LLM (needs ANTHROPIC_API_KEY; falls back to the rule
