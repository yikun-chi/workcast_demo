id: baseline
title: "The experiment as run: hybrid WFH (Wed/Fri) offered to the group offered hybrid work"
short_title: The experiment as run
description: >
  1,612 Airfare and IT employees, 9 Aug 2021 to 23 Jan 2022. Employees with even-numbered birthdays
  (the group offered hybrid work, 792 people) may work from home on Wednesdays and Fridays; the office-only group (820)
  stays in the office five days a week. Non-volunteers became eligible on 9 Aug 2021 and volunteers on
  13 Sep 2021, as in the experiment. Survey at the end of the experiment 21 Jan 2022; semi-annual review covers 2021H2.
horizon_days: 168
seeds: [1, 2, 3, 4, 5]
world:
  start: "2021-08-09"
  end: "2022-01-23"
  arm_field: treat
  arm_labels: {"0": Control, "1": Treatment}
  breakdowns: [managerial, female, live_far, volunteer]
  policy:
    type: wfh_offer
    days: [Wed, Fri]
    who: treat
    phase_in:                       # experiment design (extendedfigure3.do reference lines; group order as coded in the deposit)
      - {field: volunteer, value: 0, start: "2021-08-09"}
      - {field: volunteer, value: 1, start: "2021-09-13"}
  survey_dates: ["2022-01-21"]
  survey_response_rate: 1.0         # prediction all survivors; realized endline response is unavailable before the policy
  review_period: {id: "2021H2", date: "2022-01-14"}
  holidays: ["2021-09-20", "2021-09-21", "2021-10-01", "2021-10-04", "2021-10-05", "2021-10-06", "2021-10-07"]
  work_events: all                  # all | sample | none
  work_events_sample: 0.1
  priors: sample                    # sample | central
interventions: []
