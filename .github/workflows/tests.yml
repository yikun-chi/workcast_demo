name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        planner-extra: ['', '--extra langgraph']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv sync --locked --extra dev ${{ matrix.planner-extra }}
      - run: uv run --locked --extra dev ${{ matrix.planner-extra }} pytest -m 'not data' -q
