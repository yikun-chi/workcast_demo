[project]
name = "orgsim"
version = "0.1.0"
description = "Organization simulation platform: ontology, hourly-tick kernel, swappable AI policies, evaluation, web UI"
requires-python = ">=3.12"
dependencies = [
  "pandas>=3.0", "pyarrow>=20", "numpy>=2", "scipy>=1.14", "lxml>=5",
  "pydantic>=2", "pyyaml>=6", "fastapi>=0.110", "uvicorn[standard]>=0.30", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: requires downloaded datasets, normalized data, or saved evaluation runs"]

[project.scripts]
orgsim = "orgsim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orgsim*"]
