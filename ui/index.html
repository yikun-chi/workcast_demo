<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emergent Science - WORKCAST simulation</title>
  <link rel="icon" type="image/svg+xml" href="/ui/assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/ui/theme.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="app-header" id="header">
    <a class="brand" href="#/"><img class="brand-logo" src="/ui/assets/logo.svg" alt="Emergent Science" width="30" height="30"><span class="brand-text"><span class="brand-name">Emergent Science</span><span class="brand-product">WORKCAST <span class="brand-sub">simulation</span></span></span></a>
    <div id="header-instance" class="instance-switcher"></div>
    <div class="header-right">
      <span id="fixture-badge"></span>
      <button class="btn ghost sm" id="theme-toggle" title="Toggle light / dark">Theme</button>
    </div>
  </header>
  <nav class="app-tabs" id="tabs"></nav>
  <main class="app-main" id="main"></main>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head"><h3 id="drawer-title"></h3><button class="btn ghost sm" id="drawer-close">Close</button></div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="toast-host" id="toasts"></div>
  <script type="module" src="/ui/app.js"></script>
</body>
</html>
