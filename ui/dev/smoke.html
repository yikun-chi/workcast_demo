<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>orgsim UI smoke test</title>
  <link rel="stylesheet" href="/ui/theme.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js"></script>
  <style>#log { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; padding: 12px; } .stage { padding: 12px; border-top: 2px dashed var(--border-strong); }</style>
</head>
<body>
  <!-- Open as /ui/dev/smoke.html?fixtures=1 (or without the flag against the live API). Exercises every page's interactive paths and prints SMOKE lines to the console. -->
  <div id="log"></div>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer"><div class="drawer-head"><h3 id="drawer-title"></h3><button id="drawer-close">x</button></div><div class="drawer-body" id="drawer-body"></div></aside>
  <div class="toast-host" id="toasts"></div>
  <div id="stages"></div>
  <script type="module">
    import { api } from "/ui/api.js";
    import { drawer } from "/ui/components/ui.js";
    const errors = [];
    const logEl = document.getElementById("log");
    const log = (m) => { logEl.textContent += m + "\n"; console.log("SMOKE " + m); };
    const fail = (m) => { errors.push(m); logEl.textContent += "FAIL " + m + "\n"; console.error("SMOKE FAIL " + m); };
    window.addEventListener("error", e => fail("window.error " + e.message));
    window.addEventListener("unhandledrejection", e => fail("unhandledrejection " + (e.reason && e.reason.message || e.reason)));
    const origErr = console.error.bind(console); console.error = (...a) => { if (!String(a[0]).startsWith("SMOKE")) errors.push("console.error " + a.map(String).join(" ")); origErr(...a); };
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const until = async (fn, ms = 8000, step = 100) => { const t = Date.now(); while (Date.now() - t < ms) { try { if (fn()) return true; } catch { /* retry */ } await sleep(step); } return false; };
    const stage = (name) => { const d = document.createElement("div"); d.className = "stage"; d.id = "stage-" + name; document.getElementById("stages").append(d); return d; };
    const instances = await api.instances();
    const primary = new URLSearchParams(location.search).get("instance") || instances[0].id;
    const inst = await api.instance(primary);
    const href = (i, p, ...r) => `#/${[i, p, ...r].filter(Boolean).join("/")}`;
    const navigate = (h) => log("navigate -> " + h);
    const ctx = (instanceId, params = [], extra = {}) => ({ api, instanceId, instance: instanceId === primary ? inst : (instances.find(i => i.id === instanceId) || inst), instances, params, navigate, href, refreshInstance: async () => inst, ...extra });
    const assert = (c, m) => c ? log("ok   " + m) : fail(m);

    async function run(name, fn) { try { await fn(); } catch (e) { fail(`${name}: ${e && e.stack || e}`); } }

    await run("landing", async () => { const m = await import("/ui/pages/landing.js"); const r = stage("landing"); await m.render(r, { instances, href }); assert(r.querySelectorAll(".instance-card").length === instances.length, "landing cards"); });

    await run("overview", async () => { const m = await import("/ui/pages/overview.js"); const r = stage("overview"); await m.render(r, ctx(primary)); assert(r.querySelector("h1"), "overview rendered"); const link = r.querySelector("table a.mono"); if (link) { link.click(); assert(await until(() => document.querySelector("#drawer-body table tbody tr")), "occupation drawer shows DWAs"); drawer.close(); } });
    await run("ontology/concepts", async () => { const m = await import("/ui/pages/ontology.js"); const r = stage("ontology-concepts"); r.style.height = "700px"; const c = await m.render(r, ctx(primary, ["concepts"])); assert(await until(() => r.querySelectorAll(".concept-table tbody tr").length > 10, 8000), "relations table"); const row = r.querySelector(".concept-table tbody tr"); row.click(); assert(await until(() => r.textContent.includes("Relations out") || r.textContent.includes("Relations in")), "concept selection"); c && c(); });
    await run("ontology/edit", async () => { const m = await import("/ui/pages/ontology.js"); const r = stage("ontology-edit"); await m.render(r, ctx(primary, ["edit"])); const ta = r.querySelector("textarea"); assert(ta && ta.value.trim().startsWith("{"), "bindings JSON editor"); ta.value = "{bad"; ta.dispatchEvent(new Event("input")); assert(await until(() => r.textContent.includes("Invalid JSON")), "invalid JSON flagged"); });
    await run("data/tables", async () => { const m = await import("/ui/pages/data.js"); const r = stage("data-tables"); await m.render(r, ctx(primary, ["tables"])); const ok = await until(() => r.querySelector("table tbody tr") || r.querySelector(".empty")); assert(ok, "data grid loaded"); const th = r.querySelector("th.sortable"); if (th) { th.click(); assert(await until(() => r.querySelector(".sort-ind")), "column sort"); } });
    await run("data/graph", async () => { const m = await import("/ui/pages/data.js"); const r = stage("data-graph"); const c = await m.render(r, ctx(primary, ["graph"])); const ok = await until(() => r.querySelector(".data-grid table tbody tr") || r.querySelector(".error-box"), 10000); assert(ok, "people grid or error state"); const row = r.querySelector(".data-grid table tbody tr"); if (row) { row.click(); assert(await until(() => r.textContent.includes("Connections"), 10000), "ego network loaded"); } else log("skip (fixture mode has no people view)"); c && c(); });
    await run("data/edit", async () => { const m = await import("/ui/pages/data.js"); const r = stage("data-edit"); await m.render(r, ctx(primary, ["edit"])); const add = [...r.querySelectorAll("button")].find(b => b.textContent.includes("Add role")); if (add) { const n = r.querySelectorAll("table tbody tr").length; add.click(); assert(r.querySelectorAll("table tbody tr").length === n + 1, "add role row"); } else log("skip add role (no bindings)"); });
    await run("scenarios", async () => { const m = await import("/ui/pages/scenarios.js"); const r = stage("scenarios"); await m.render(r, ctx(primary)); const cards = r.querySelectorAll(".scenario-hero"); assert(cards.length >= 1 || r.querySelector(".empty"), "scenario cards " + cards.length); });
    await run("scenarios/detail", async () => { const m = await import("/ui/pages/scenarios.js"); const r = stage("scenarios-detail"); await m.render(r, ctx(primary, ["baseline"])); assert(r.querySelector("textarea") && r.textContent.includes("Seats"), "scenario detail with parameters and seats"); const sel = r.querySelector("table select"); if (sel) { sel.value = "llm"; sel.dispatchEvent(new Event("change")); assert(r.querySelector("table input[list]") && !r.querySelector("table input[list]").disabled, "adapter switch enables model field"); } });
    await run("runs", async () => { const runs = await api.runs(primary); const m = await import("/ui/pages/runs.js"); const r = stage("runs"); const first = runs.find(x => x.complete); await m.render(r, ctx(primary, first ? [first.scenario, first.run_id] : [])); if (!first) { assert(r.querySelector(".empty"), "runs empty state"); return; } assert(await until(() => r.querySelector("canvas")), "timeline chart"); assert(await until(() => r.querySelectorAll(".data-grid").length >= 2 && r.querySelectorAll(".data-grid table tbody tr").length > 0, 10000), "agents + trace grids"); });
    await run("results", async () => { const m = await import("/ui/pages/results.js"); const r = stage("results"); await m.render(r, ctx(primary)); assert(await until(() => r.querySelector(".part-no") || r.querySelector(".error-box"), 8000), "results rendered"); assert(r.querySelector(".story-flow") || r.querySelector(".hero-card") || r.querySelector(".error-box"), "ground truth vs simulated block"); });
    await run("insights", async () => { const m = await import("/ui/pages/insights.js"); const r = stage("insights"); await m.render(r, ctx(primary)); assert(await until(() => r.querySelector(".quote") || r.querySelector(".empty") || r.querySelector(".error-box"), 8000), "insights rendered"); });

    await run("insights/first-generation", async () => {
      const m = await import("/ui/pages/insights.js"); const r = stage("insights-first-generation");
      const built = { method: "template", scenarios: { baseline: { title: "Baseline", interviews: [], groups: {}, topics: [], sentiment: {}, n_interviews: 0 } } };
      await m.render(r, ctx(primary, [], { api: { ...api, insights: async () => null, buildInsights: async () => built } }));
      r.querySelector("button").click();
      assert(await until(() => r.textContent.includes("Interviews (0)")), "first generated interviews displayed");
    });

    // second instance: every page must degrade gracefully
    const other = instances.find(i => i.id !== primary);
    if (other) for (const [p, params] of [["overview", []], ["ontology", []], ["ontology", ["edit"]], ["data", []], ["data", ["graph"]], ["data", ["edit"]], ["scenarios", []], ["runs", []], ["results", []], ["insights", []]]) {
      await run(`${other.id}/${p}`, async () => { const m = await import(`/ui/pages/${p}.js`); const r = stage(`${other.id}-${p}-${params[0] || ""}`); r.style.height = p === "ontology" || params[0] === "graph" ? "500px" : ""; const c = await m.render(r, ctx(other.id, params)); await sleep(600); assert(!r.querySelector(".error-box"), `${other.id}/${p} no error box`); c && c(); });
    }
    log(`DONE errors=${errors.length}`);
    for (const e of errors) log("  " + e);
  </script>
</body>
</html>
